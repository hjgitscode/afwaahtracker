# AfwaahTracker - HTTPS site (used once a Let's Encrypt certificate exists for ${DOMAIN}).
# 40-afwaah-config.sh substitutes ${DOMAIN} at container start.
# Shared by the HTTP and HTTPS servers (http context: conf.d is included there)
upstream afwaah_api {
    server server:3000;
    keepalive 16;
}
limit_req_zone $binary_remote_addr zone=afwaah_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=afwaah_investigate:10m rate=6r/m;

# HTTP: Let's Encrypt challenges, everything else redirected to HTTPS
server {
    listen 80;
    server_name ${DOMAIN};
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ${DOMAIN};

    ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 32k;
    server_tokens off;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Live web investigations spend search credits: a second limit in front of
    # the API's own per-IP and daily limits
    location = /api/investigate-web {
        limit_req zone=afwaah_investigate burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://afwaah_api;
        include /etc/nginx/afwaah/proxy_params;
    }

    # Express API
    location /api/ {
        limit_req zone=afwaah_api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://afwaah_api;
        include /etc/nginx/afwaah/proxy_params;
    }

    # Hashed build assets never change
    # (expires instead of add_header, so the server-level security headers are inherited)
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # React Router: unknown paths serve index.html
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }

    # Friendly JSON when the API container is down or restarting
    error_page 502 503 504 = @api_down;
    location @api_down {
        default_type application/json;
        return 503 '{"error":{"code":"API_UNAVAILABLE","message":"The AfwaahTracker API is restarting. Please try again shortly."}}';
    }
}
